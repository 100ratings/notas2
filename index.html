<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Notas">
  <meta name="description" content="Notas com aparência inspirada no iOS 26">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Notas</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff;
      --text: #151515;
      --gray: #8b8b90;
      --gray-dark: #64646a;
      --tint: #dda900;
      --surface: rgba(248, 248, 250, .93);
      --glass: rgba(247,247,250,.78);
      --line: rgba(0,0,0,.07);
      --shadow: 0 4px 22px rgba(23,23,23,.07);
      --paper: #fff;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #000;
      --text: #f4f4f5;
      --gray: #98989e;
      --gray-dark: #b4b4b8;
      --tint: #e6af00;
      --surface: rgba(35,35,37,.92);
      --glass: rgba(33,33,36,.80);
      --line: rgba(255,255,255,.10);
      --shadow: 0 4px 23px rgba(0,0,0,.34);
      --paper: #000;
    }
    *, *::before,*::after {box-sizing:border-box}
    html,body {padding:0;margin:0;height:100%;overscroll-behavior:none}
    body {
      font: 17px/1.38 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
      user-select:none;-webkit-tap-highlight-color:transparent;
    }
    button, input, textarea {font:inherit}
    button {border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    #app {background:var(--paper);height:100dvh;min-height:320px;display:flex;flex-direction:column;overflow:hidden;position:relative}
    @supports not (height: 100dvh) {#app {height:100vh}}
    .notch-spacer {height:env(safe-area-inset-top);min-height:4px;flex-shrink:0}
    .nav {
      height:57px;flex-shrink:0;display:flex;align-items:center;
      padding:4px 19px 5px 18px;gap:10px;
    }
    .nav-left {margin-right:auto;display:flex;align-items:center;gap:10px}
    .nav-right {display:flex;align-items:center;gap:10px}
    .circle {
      width:35px;height:35px;display:grid;place-items:center;border-radius:50%;
      background:var(--surface);box-shadow:var(--shadow);color:var(--text);padding:0;flex-shrink:0;
    }
    .circle:active,.capsule:active,.toolgroup button:active {opacity:.58}
    .circle svg {width:21px;height:21px}
    .circle.gold {background:#e4ac00;color:#fff;box-shadow:none;width:36px;height:36px}
    .capsule {height:35px;display:flex;align-items:center;gap:0;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;padding:0 2px}
    .capsule button {width:39px;height:35px;color:var(--text);background:transparent;padding:0;display:grid;place-items:center}
    .capsule svg {width:19px;height:19px}
    .nav-label {font-size:16px;color:var(--tint);font-weight:500;white-space:nowrap;background:transparent;padding:0}
    .nav-label:active{opacity:.6}
    .note-pane {display:flex;min-height:0;flex:1;flex-direction:column;background:var(--paper)}
    .note-date {font-size:12px;line-height:17px;color:var(--gray);text-align:center;padding:15px 10px 13px;flex-shrink:0;letter-spacing:.01em}
    #noteText {
      border:0;outline:none;box-shadow:none;background:transparent;color:var(--text);
      width:100%;min-height:0;flex:1;resize:none;
      padding:0 23px 24px 22px;
      overflow-x:hidden;overflow-y:auto;
      font-size:17px;line-height:25.3px;letter-spacing:-.22px;
      -webkit-text-size-adjust:100%;-webkit-overflow-scrolling:touch;
      user-select:text;-webkit-user-select:text;caret-color:var(--tint);
      white-space:pre-wrap;overflow-wrap:normal;
    }
    #noteText::selection {background:rgba(236,175,11,.28)}
    .toolbar {
      height:65px;flex-shrink:0;display:flex;align-items:center;
      justify-content:space-between;padding:5px 20px 7px;position:relative;z-index:2;
      border-top:1px solid rgba(0,0,0,0);
      background:var(--paper);
    }
    .toolgroup {
      height:43px;display:flex;align-items:center;gap:1px;padding:2px 4px;
      border-radius:24px;background:var(--glass);box-shadow:var(--shadow);
      -webkit-backdrop-filter:blur(23px);backdrop-filter:blur(23px);
    }
    .toolgroup button {width:43px;height:37px;padding:0;display:grid;place-items:center;color:var(--text);background:transparent;border-radius:19px}
    .toolgroup svg {width:22px;height:22px}
    .toolgroup .format {font-weight:500;font-size:19px;letter-spacing:-1px}
    .new-note {width:43px;height:43px;background:var(--surface);border-radius:23px;display:grid;place-items:center;color:var(--tint);box-shadow:var(--shadow)}
    .new-note svg {width:22px;height:22px}
    .bottom-safe {height:env(safe-area-inset-bottom);min-height:0;flex-shrink:0;background:var(--paper)}
    .screen-list {background:var(--bg);flex:1;min-height:0;display:none;overflow:auto;}
    .list-header {padding:10px 24px 12px}
    .list-header h1 {font-size:35px;font-weight:700;letter-spacing:-1.1px;margin:9px 0 16px}
    .search {height:38px;border-radius:11px;background:rgba(150,150,160,.13);color:var(--gray);display:flex;gap:7px;align-items:center;padding:0 11px;font-size:17px}
    .search svg {height:18px;width:18px}
    .note-card {margin:0 18px;border-radius:13px;padding:15px 17px;background:var(--surface);text-align:left;width:calc(100% - 36px);color:var(--text)}
    .note-card strong {display:block;font-size:17px}
    .note-card span {display:block;color:var(--gray-dark);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}
    .list-footer {display:none;height:64px;align-items:center;justify-content:space-between;padding:0 22px}
    .menu {position:absolute;right:18px;top:calc(env(safe-area-inset-top) + 54px);width:254px;border-radius:21px;background:var(--glass);box-shadow:0 12px 44px rgba(0,0,0,.20);-webkit-backdrop-filter:blur(28px);backdrop-filter:blur(28px);overflow:hidden;z-index:11;display:none;padding:7px}
    .menu button {background:transparent;color:var(--text);display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 11px;border-radius:12px;text-align:left;font-size:15px}
    .menu button:active {background:var(--line)}
    .menu .sep {height:1px;background:var(--line);margin:5px 0}
    .shade {display:none;position:absolute;inset:0;z-index:10}
    .note-keyboard-toolbar {display:none;}
    #app.editing .toolbar {display:none}
    #app.editing .note-keyboard-toolbar {height:44px;display:flex;align-items:center;gap:15px;justify-content:space-around;flex-shrink:0;border-radius:24px;background:var(--glass);margin:0 14px 8px;padding:6px 14px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
    .note-keyboard-toolbar button {background:transparent;color:var(--text);font-size:17px;padding:0 5px}
    #app.show-list .note-pane,#app.show-list .toolbar {display:none}
    #app.show-list .screen-list {display:block}
    #app.show-list .list-footer {display:flex}
    #app.show-list .nav-note {display:none}
    #app:not(.show-list) .nav-list {display:none}
    #app.show-list .nav-list {display:flex}
    #app .nav-list {display:none;align-items:center;width:100%;justify-content:space-between}
    #app .nav-list .capsule {margin-left:auto}
    .fade {animation:appear .14s ease-out}
    @keyframes appear {from{opacity:.4}to{opacity:1}}
    @media(min-width:700px) {
      body {background:#ebebee;display:flex;align-items:center;justify-content:center}
      #app {width:428px;height:min(926px,96vh);border-radius:48px;border:7px solid #19191b;box-shadow:0 20px 80px rgba(0,0,0,.22);overflow:hidden}
      .notch-spacer {height:38px}
      .bottom-safe {height:17px}
    }
    @media(max-width:370px) {
      .nav {padding-left:12px;padding-right:12px;gap:6px}
      .nav-right {gap:7px}
      .nav-label {font-size:15px}
      #noteText {padding-left:18px;padding-right:18px}
    }
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

    /* A versão de referência tinha a navegação duplicada na tela de listas */
    #app.show-list .nav-note{display:none!important}
    /* Lista de notas e busca com entrada codificada invisível */
    .search-row{display:flex;align-items:center;gap:10px}
    .search{flex:1;min-width:0}
    .search input{min-width:0;flex:1;outline:none;border:0;background:transparent;color:var(--text);font-size:17px;padding:0;margin:0;border-radius:0;appearance:none;-webkit-appearance:none;line-height:1.2;box-shadow:none}
    .search input::placeholder{color:var(--gray);opacity:1}
    #searchCancel{display:none;background:transparent;color:var(--tint);white-space:nowrap;padding:6px 0;font-size:16px}
    #app.searching #searchCancel{display:block}
    .note-cards{padding-bottom:12px}
    .note-cards .note-card{display:block;margin-bottom:10px;min-height:75px}
    .screen-list{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
    #noteText{overscroll-behavior:contain}
    @media(max-width:370px){.search input{font-size:16px}.note-cards .note-card{margin-left:12px;margin-right:12px;width:calc(100% - 24px)}}
  </style>
</head>
<body>
<div id="app" class="show-list">
  <div class="notch-spacer"></div>
  <nav class="nav" aria-label="Navegação">
    <div class="nav-note" style="display:flex;align-items:center;width:100%;gap:10px">
      <div class="nav-left">
        <button class="circle" id="backButton" aria-label="Voltar para notas">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"><path d="m14.9 5.6-6.6 6.4 6.6 6.4"/></svg>
        </button>
        <button class="nav-label" id="backLabel">Notas</button>
      </div>
      <div class="nav-right">
        <button class="circle" id="undoButton" aria-label="Desfazer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8.1 8 4.5 11.4l3.6 3.4"/><path d="M4.7 11.4h8.2c4 0 6.6 2 6.6 5.7"/></svg>
        </button>
        <div class="capsule">
          <button id="shareButton" aria-label="Compartilhar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0L8.6 6.4M12 3l3.4 3.4"/><path d="M8 8H6.2c-1 0-1.8.8-1.8 1.8v9.5c0 1 .8 1.7 1.8 1.7h11.6c1 0 1.8-.7 1.8-1.7V9.8c0-1-.8-1.8-1.8-1.8H16"/></svg>
          </button>
          <button id="moreButton" aria-label="Mais opções">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
          </button>
        </div>
        <button class="circle gold" id="doneButton" aria-label="Concluído">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.1 4.7 4.7L19 7.3"/></svg>
        </button>
      </div>
    </div>
    <div class="nav-list">
      <button class="circle" id="foldersButton" aria-label="Pastas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"><path d="m14.9 5.6-6.6 6.4 6.6 6.4"/></svg>
      </button>
      <div class="capsule"><button id="listMore" aria-label="Mais opções"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button></div>
    </div>
  </nav>
  <main class="note-pane" aria-label="Nota de animais">
    <div class="note-date" id="noteDate"></div>
    <textarea id="noteText" aria-label="Conteúdo da nota" spellcheck="false" autocapitalize="sentences" autocomplete="off" autocorrect="off" wrap="soft"></textarea>
  </main>
  <div class="screen-list">
    <div class="list-header">
      <h1>Notas</h1>
      <div class="search-row">
        <div class="search" id="searchField">
          <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
          <input id="searchInput" type="text" placeholder="Buscar" aria-label="Buscar notas" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" inputmode="text" enterkeyhint="search">
        </div>
        <button id="searchCancel" type="button">Cancelar</button>
      </div>
    </div>
    <div class="note-cards" id="noteCards"></div>
  </div>
  <div class="toolbar">
    <div class="toolgroup">
      <button id="checklistButton" aria-label="Lista de verificação"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="7" r="2.1"/><path d="m4.6 7 1 1 1.9-2M11 7h8"/><circle cx="5.5" cy="17" r="2.1"/><path d="m4.6 17 1 1 1.9-2M11 17h8"/></svg></button>
      <button id="attachmentButton" aria-label="Anexar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m8.6 12.1 6.1-6.2a3.2 3.2 0 0 1 4.6 4.6l-8.5 8.6a5 5 0 0 1-7.1-7.1l9-9"/></svg></button>
      <button id="drawingButton" aria-label="Desenhar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m7 16 5.5-9 3.8 9M9.4 13h5.3"/></svg></button>
      <button id="formatButton" class="format" aria-label="Formatação">Aa</button>
    </div>
    <button id="composeButton" class="new-note" aria-label="Nova nota"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18.5 13.7V19a1.8 1.8 0 0 1-1.8 1.8H5a1.8 1.8 0 0 1-1.8-1.8V7.1A1.8 1.8 0 0 1 5 5.3h7.3"/><path d="M10.2 15.4 12 11.7l6.5-6.5a1.8 1.8 0 0 1 2.6 2.6l-6.6 6.5z"/></svg></button>
  </div>
  <div class="note-keyboard-toolbar"><button type="button">Aa</button><button type="button">☷</button><button type="button">▦</button><button type="button">⌁</button><button type="button">⊗</button></div>
  <div class="list-footer"><span id="notesCount" style="color:var(--gray);font-size:13px">9 Notas</span><button id="listCompose" class="new-note" aria-label="Nova nota"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18.5 13.7V19a1.8 1.8 0 0 1-1.8 1.8H5a1.8 1.8 0 0 1-1.8-1.8V7.1A1.8 1.8 0 0 1 5 5.3h7.3"/><path d="M10.2 15.4 12 11.7l6.5-6.5a1.8 1.8 0 0 1 2.6 2.6l-6.6 6.5z"/></svg></button></div>
  <div class="bottom-safe"></div>
  <div class="shade" id="shade"></div>
  <div class="menu" id="menu" role="menu">
    <button id="findInNote">Buscar na Nota <span>⌕</span></button>
    <button id="linesAndGrids">Linhas e Grades <span>▦</span></button>
    <div class="sep"></div>
    <button id="darkToggle">Aparência <span>◐</span></button>
    <button id="infoButton">Detalhes da Nota <span>ⓘ</span></button>
  </div>
</div>
<script>
/*
  Protótipo original inspirado no projeto de código aberto ios-notes
  https://github.com/shishkannov/ios-notes
  Não contém código copiado daquele repositório
*/
(() => {
  'use strict';
  const ORIGINAL = `Joaninha 🐞
Raposa 🦊
Tiranossauro 🦖
Caracol 🐌
Porco 🐷
Gorila 🦍

Mosquito 🦟
Búfalo 🐃
Coala 🐨
Cobra 🐍
Preguiça 🦥
Coelho 🐰
Onça-pintada 🐆
Lobo 🐺
Bisão 🦬
Camundongo 🐁
Baiacu 🐡
Javali 🐗
Formiga 🐜
Polvo 🐙
Hipopótamo 🦛
Cabra 🐐
Girafa 🦒
Peru 🦃
Ganso 🪿
Jumento 🫏
Peixe-palhaço 🐠
Flamingo 🦩
Urso-pardo 🐻
Elefante 🐘
Piranha 🐟
Grilo 🦗
Alce 🫎
Urso-polar 🐻‍❄️
Dromedário 🐫
Macaco 🐒
Canguru 🦘
Ostra 🦪`;
  // Configure os títulos e as prévias das notas fictícias livremente
  const FAKE_NOTES = [
    {title:'COMPRAS', preview:'Café, frutas, pão, leite', text:'COMPRAS\n\nCafé\nFrutas\nPão\nLeite'},
    {title:'FILMES', preview:'Filmes para assistir', text:'FILMES\n\nFilmes para assistir\nClássicos\nSuspense'},
    {title:'RECEITAS', preview:'Ingredientes e ideias', text:'RECEITAS\n\nBolo\nRisoto\nMassa'},
    {title:'LIVROS', preview:'Próximas leituras', text:'LIVROS\n\nPróximas leituras\nRomances\nContos'},
    {title:'MÚSICAS', preview:'Playlists favoritas', text:'MÚSICAS\n\nPlaylists favoritas\nNovas descobertas'},
    {title:'VIAGENS', preview:'Lugares para visitar', text:'VIAGENS\n\nLugares para visitar\nPasseios'},
    {title:'IDEIAS', preview:'Anotações e projetos', text:'IDEIAS\n\nAnotações e projetos'},
    {title:'PRESENTES', preview:'Lista de presentes', text:'PRESENTES\n\nLista de presentes'}
  ];

  const THEME_KEY = 'notas-ios26-animais-theme';
  const KEYMAP = Object.freeze({i:1,o:2,p:3,j:4,k:5,l:6,b:7,n:8,m:9});
  const app = document.getElementById('app');
  const textarea = document.getElementById('noteText');
  const noteDate = document.getElementById('noteDate');
  const menu = document.getElementById('menu');
  const shade = document.getElementById('shade');
  const noteCards = document.getElementById('noteCards');
  const notesCount = document.getElementById('notesCount');
  const searchInput = document.getElementById('searchInput');
  const searchField = document.getElementById('searchField');
  const doneButton = document.getElementById('doneButton');
  const ORIGINAL_ITEMS = ORIGINAL.split('\n');
  const FORCE_ITEM = 'Joaninha 🐞';
  if (ORIGINAL_ITEMS.length !== 100 || ORIGINAL_ITEMS[0] !== FORCE_ITEM || new Set(ORIGINAL_ITEMS).size !== 100) {
    throw new Error('A lista original precisa ter 100 animais únicos e começar pela Joaninha');
  }

  let position = 1;
  let vanished = false;
  let activeNote = 'ANIMAIS';
  let searchActive = false;
  let secretKeys = [];
  let vanishTimer = null;
  let listScrollBefore = 0;
  let editTimer;
  let undoSnapshot = null;

  const savedTheme = localStorage.getItem(THEME_KEY);
  if (savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.dataset.theme = 'dark';
  }

  // O animal forçado é removido do início e reinserido na posição indicada
  function makeList(chosenPosition, withEmoji = true) {
    const list = ORIGINAL_ITEMS.filter(item => item !== FORCE_ITEM);
    list.splice(chosenPosition - 1, 0, withEmoji ? FORCE_ITEM : 'Joaninha');
    return list.map((item, index) => `${index + 1}. ${item}`).join('\n');
  }

  function clearVanishTimer() {
    if (vanishTimer !== null) { clearTimeout(vanishTimer); vanishTimer = null; }
  }

  function setNoteText(nextText, preserveScroll = true) {
    const previousScroll = preserveScroll ? textarea.scrollTop : 0;
    textarea.value = nextText;
    // O Safari costuma ajustar a rolagem ao atribuir value; devolvê-la no mesmo frame
    textarea.scrollTop = previousScroll;
    return previousScroll;
  }

  function refreshAnimals(preserveScroll = true) {
    if (activeNote === 'ANIMAIS') setNoteText(makeList(position, !vanished), preserveScroll);
  }

  function vanishJoaninha() {
    if (vanished || activeNote !== 'ANIMAIS' || app.classList.contains('show-list')) return false;
    const before = textarea.value;
    const changed = before.replace(/^(\d{1,3}\. Joaninha) 🐞(?=\r?$)/m, '$1');
    if (before === changed) return false;
    const scroll = textarea.scrollTop;
    undoSnapshot = before;
    vanished = true;
    setNoteText(changed, true);
    // O valor textual muda, mas nenhum item é inserido/removido e a altura das linhas é igual
    textarea.scrollTop = scroll;
    return true;
  }

  function resetTrick() {
    clearVanishTimer();
    position = 1;
    vanished = false;
    secretKeys = [];
    undoSnapshot = null;
  }

  function armSearch() {
    clearVanishTimer();
    searchActive = true;
    secretKeys = [];
    searchInput.value = '';
    app.classList.add('searching');
    renderCards();
  }

  function unarmSearch() {
    searchActive = false;
    secretKeys = [];
    searchInput.value = '';
    app.classList.remove('searching');
    searchInput.blur();
    renderCards();
  }

  function decodeSecret(keys) {
    if (keys.length !== 2) return null;
    const digits = keys.map(key => KEYMAP[key] ?? 0);
    const number = digits[0] * 10 + digits[1];
    return number === 0 ? 100 : number;
  }

  function acceptSecretKey(raw) {
    if (!searchActive || secretKeys.length >= 2 || !raw) return;
    // Cada tecla física equivale a um algarismo, mesmo uma tecla não mapeada
    const key = String(raw).toLocaleLowerCase('pt-BR');
    secretKeys.push(key);
    searchInput.value = secretKeys.length === 1 ? 'A' : 'AN';
    try {searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length)} catch (_) {}
    if (secretKeys.length === 2) {
      const decoded = decodeSecret(secretKeys);
      if (decoded !== null) {
        position = decoded;
        vanished = false;
        undoSnapshot = null;
      }
    }
    renderCards();
  }

  function handleSearchBeforeInput(event) {
    if (!searchActive) return;
    if (event.inputType && event.inputType.startsWith('delete')) {
      if (event.cancelable) event.preventDefault();
      secretKeys.pop();
      searchInput.value = secretKeys.length === 0 ? '' : secretKeys.length === 1 ? 'A' : 'AN';
      renderCards();
      return;
    }
    if (event.inputType && event.inputType.startsWith('insert')) {
      if (event.cancelable) event.preventDefault();
      // A digitação real nunca aparece na tela
      const chars = Array.from(event.data || '');
      for (const char of chars) {if (secretKeys.length < 2 && char.trim()) acceptSecretKey(char)}
    }
  }

  searchInput.addEventListener('beforeinput', handleSearchBeforeInput);
  // Compatibilidade com teclados que não emitem beforeinput cancelável
  searchInput.addEventListener('input', () => {
    if (!searchActive) return;
    const displayed = secretKeys.length === 0 ? '' : secretKeys.length === 1 ? 'A' : 'AN';
    const actual = searchInput.value;
    if (actual !== displayed) {
      let inserted = '';
      if (actual.startsWith(displayed)) inserted = actual.slice(displayed.length);
      else if (actual) inserted = actual.replace(/^(?:AN|A)/, '');
      for (const char of Array.from(inserted)) {if (secretKeys.length < 2) acceptSecretKey(char)}
      searchInput.value = secretKeys.length === 0 ? '' : secretKeys.length === 1 ? 'A' : 'AN';
    }
  });
  searchInput.addEventListener('keydown', event => {
    if (event.key === 'Escape') { event.preventDefault(); unarmSearch(); return; }
    if (event.key === 'Backspace' && searchActive) {
      // O beforeinput lida normalmente com a tecla no Safari; fallback no desktop
      if (!('InputEvent' in window)) {
        event.preventDefault(); secretKeys.pop();
        searchInput.value = secretKeys.length ? 'A' : ''; renderCards();
      }
    }
  });
  searchField.addEventListener('click', () => {
    // Clicar novamente em Buscar sempre recomeça a leitura do código
    if (!searchActive || secretKeys.length === 2) armSearch();
    searchInput.focus();
  });
  searchInput.addEventListener('focus', () => { if (!searchActive) armSearch(); });
  document.getElementById('searchCancel').addEventListener('click', unarmSearch);

  const records = [
    {title:'ANIMAIS', preview:'Joaninha 🐞', animals:true},
    ...FAKE_NOTES.map(note => ({...note, animals:false}))
  ];
  function renderCards() {
    let items = records;
    if (searchActive && secretKeys.length > 0) {
      const needle = secretKeys.length === 1 ? 'A' : 'AN';
      items = items.filter(note => note.title.includes(needle));
    }
    noteCards.replaceChildren();
    for (const note of items) {
      const card = document.createElement('button');
      card.type = 'button'; card.className = 'note-card';
      card.dataset.title = note.title;
      const strong = document.createElement('strong'); strong.textContent = note.title;
      const span = document.createElement('span'); span.textContent = note.preview;
      card.append(strong,span);
      card.addEventListener('click', () => {
        if (searchActive && secretKeys.length > 0 && secretKeys.length < 2 && note.animals) {
          searchInput.focus(); return;
        }
        showNote(note.title);
      });
      noteCards.appendChild(card);
    }
    notesCount.textContent = `${items.length} ${items.length === 1 ? 'Nota' : 'Notas'}`;
  }

  function showNote(which = 'ANIMAIS') {
    clearVanishTimer();
    listScrollBefore = document.querySelector('.screen-list').scrollTop;
    activeNote = which;
    searchInput.blur();
    app.classList.remove('show-list','editing');
    closeMenu();
    if (which === 'ANIMAIS') refreshAnimals(false);
    else {
      const note = FAKE_NOTES.find(note => note.title === which);
      setNoteText(note ? note.text.replace(/\\n/g,'\n') : which, false);
    }
    textarea.blur();
    textarea.scrollTop = 0;
    noteDate.textContent = new Intl.DateTimeFormat('pt-BR', {day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date()).replace(',',' às');
  }

  function showList() {
    clearVanishTimer();
    // Voltar restaura a Joaninha, descarta o código e prepara a próxima apresentação
    resetTrick();
    unarmSearch();
    textarea.blur();
    app.classList.remove('editing');
    app.classList.add('show-list');
    document.querySelector('.screen-list').scrollTop = listScrollBefore;
    closeMenu();
  }

  doneButton.addEventListener('click', () => {
    textarea.blur();
    app.classList.remove('editing');
    if (activeNote !== 'ANIMAIS' || vanished || vanishTimer !== null) return;
    vanishTimer = setTimeout(() => {
      vanishTimer = null;
      vanishJoaninha();
    },5000);
  });

  document.getElementById('backButton').addEventListener('click', showList);
  document.getElementById('backLabel').addEventListener('click', showList);
  const moreButton = document.getElementById('moreButton');
  function openMenu(){shade.style.display='block';menu.style.display='block'}
  function closeMenu(){shade.style.display='none';menu.style.display='none'}
  shade.addEventListener('click',closeMenu);
  moreButton.addEventListener('click',() => {if(menu.style.display==='block')closeMenu();else openMenu()});
  document.getElementById('listMore').addEventListener('click',openMenu);
  document.getElementById('darkToggle').addEventListener('click',() => {
    const next = document.documentElement.dataset.theme==='dark'?'light':'dark';
    document.documentElement.dataset.theme=next;
    localStorage.setItem(THEME_KEY,next);
    const color=next==='dark'?'#000000':'#ffffff';
    document.querySelector('meta[name="theme-color"]').content=color;
    closeMenu();
  });
  document.getElementById('findInNote').addEventListener('click',() => {closeMenu();textarea.focus()});
  document.getElementById('linesAndGrids').addEventListener('click',closeMenu);
  document.getElementById('infoButton').addEventListener('click',closeMenu);
  document.getElementById('undoButton').addEventListener('click', () => {
    if (vanished && activeNote === 'ANIMAIS') {vanished = false;refreshAnimals(true)}
  });
  document.getElementById('shareButton').addEventListener('click',async () => {
    try {if(navigator.share)await navigator.share({text:textarea.value,title:activeNote});
      else if(navigator.clipboard)await navigator.clipboard.writeText(textarea.value)} catch(_){}
  });
  textarea.addEventListener('focus',() => app.classList.add('editing'));
  textarea.addEventListener('blur',() => {editTimer = setTimeout(() => app.classList.remove('editing'),150)});
  document.getElementById('composeButton').addEventListener('click',() => textarea.focus());
  document.getElementById('listCompose').addEventListener('click',() => showNote('ANIMAIS'));
  document.getElementById('formatButton').addEventListener('click',() => textarea.focus());
  document.getElementById('checklistButton').addEventListener('click',() => textarea.focus());
  document.getElementById('attachmentButton').addEventListener('click',() => textarea.focus());
  document.getElementById('drawingButton').addEventListener('click',() => {});
  document.getElementById('foldersButton').addEventListener('click',() => {});
  document.querySelectorAll('.note-keyboard-toolbar button').forEach(b => b.addEventListener('click',()=>textarea.focus()));
  document.addEventListener('keydown',e => {
    if (e.key === 'Escape') {closeMenu();textarea.blur();app.classList.remove('editing')}
  });
  // Funções disponíveis no console apenas para validar os testes automatizados
  window.magicNotes = Object.freeze({
    get position(){return position},
    get vanished(){return vanished},
    get count(){return ORIGINAL_ITEMS.length},
    get text(){return makeList(position,!vanished)},
    get secretCount(){return secretKeys.length},
    decode: (a,b) => decodeSecret([String(a).toLowerCase(),String(b).toLowerCase()])
  });
  renderCards();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
})();
</script>
</body>
</html>
